<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Староста — О-26-ИСТ-СИИ-Б</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#eaeef3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080d13" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Староста">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* ==================== ТОКЕНЫ ==================== */
:root{
  --ink:#0d1a24; --ink-soft:#5b6e7d; --ink-dim:#8496a3;
  --glass:rgba(255,255,255,.58);
  --glass-hi:rgba(255,255,255,.78);
  --glass-lo:rgba(255,255,255,.34);
  --stroke:rgba(255,255,255,.65);
  --stroke-out:rgba(13,26,36,.08);
  --shadow:0 10px 30px -8px rgba(13,40,60,.18);
  --shadow-sm:0 2px 10px -2px rgba(13,40,60,.12);
  --accent:#14618f; --accent-soft:rgba(20,97,143,.14);
  --ok:#0c7a56; --ok-soft:rgba(12,122,86,.16);
  --bad:#b23b2c; --bad-soft:rgba(178,59,44,.16);
  --warn:#8a6410; --warn-soft:rgba(174,127,20,.18);
  --r:22px; --r-sm:14px; --r-xs:11px;
  --blur:22px; --blur-card:10px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --navh:66px;      /* пересчитывается из реальной высоты панели */
  --navgap:0px;     /* зазор от низа экрана до панели */
  --vh:100dvh;      /* видимая высота, меняется при клавиатуре */
  --kb:0px;         /* высота клавиатуры */
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#eaf1f7; --ink-soft:#9bb0c0; --ink-dim:#6f8494;
    --glass:rgba(28,38,49,.56);
    --glass-hi:rgba(58,74,90,.62);
    --glass-lo:rgba(20,28,37,.42);
    --stroke:rgba(255,255,255,.13);
    --stroke-out:rgba(0,0,0,.5);
    --shadow:0 12px 34px -10px rgba(0,0,0,.65);
    --shadow-sm:0 3px 12px -3px rgba(0,0,0,.5);
    --accent:#5ab0e8; --accent-soft:rgba(90,176,232,.18);
    --ok:#4fc79a; --ok-soft:rgba(79,199,154,.18);
    --bad:#f08878; --bad-soft:rgba(240,136,120,.18);
    --warn:#e0b458; --warn-soft:rgba(224,180,88,.18);
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;min-height:100%}
html{background:#e9eef4}
@media (prefers-color-scheme:dark){ html{background:#080e15} }
body{
  color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  background:transparent;
  min-height:100vh;
  min-height:100dvh;
  overscroll-behavior-y:none;
  overflow-x:hidden;
  padding-bottom:0;
}

/* ==================== ФОН, КОТОРЫЙ ПРЕЛОМЛЯЕТСЯ ==================== */
.bgfx{
  position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;
  background:linear-gradient(175deg,#eef2f7 0%,#dfe8f2 46%,#cddcec 100%);
  transform:translateZ(0);
}
@media (prefers-color-scheme:dark){
  .bgfx{background:linear-gradient(175deg,#0e1721 0%,#0a121b 46%,#0b1420 100%)}
}
.bgfx span{position:absolute;border-radius:50%;filter:blur(66px);opacity:.5}
.bgfx span:nth-child(1){width:82vw;height:82vw;top:-24vw;left:-20vw;background:#7fb4e0}
.bgfx span:nth-child(2){width:64vw;height:64vw;top:22vh;right:-26vw;background:#c3b4e6}
.bgfx span:nth-child(3){width:78vw;height:78vw;bottom:-12vh;left:-22vw;background:#86d4c6}
.bgfx span:nth-child(4){width:52vw;height:52vw;top:46vh;left:20vw;background:#f0c9a8;opacity:.36}
.bgfx span:nth-child(5){width:88vw;height:44vh;bottom:-14vh;right:-14vw;background:#8ab8e2;opacity:.46}
@media (prefers-color-scheme:dark){
  .bgfx span{opacity:.3;filter:blur(78px)}
  .bgfx span:nth-child(4){opacity:.2}
  .bgfx span:nth-child(5){opacity:.28}
}

/* ==================== СТЕКЛО ==================== */
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
  backdrop-filter:blur(var(--blur)) saturate(180%);
  border:.5px solid var(--stroke);
  box-shadow:var(--shadow), inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 var(--glass-lo);
}

.wrap{
  max-width:720px;margin:0 auto;
  padding:calc(10px + var(--safe-t)) calc(14px + var(--safe-r)) 14px calc(14px + var(--safe-l));
  display:flex;flex-direction:column;
  min-height:100vh;
  min-height:var(--vh);
  padding-bottom:calc(var(--navh) + var(--navgap) + 26px);
}
.wrap>ul{flex:1 0 auto;display:flex;flex-direction:column}
.wrap>ul>.empty{margin:auto 0}
.wrap>.empty{flex:1 0 auto;display:flex;flex-direction:column;justify-content:center}
h2{font-size:15px;margin:22px 4px 9px;font-weight:600;letter-spacing:-.01em;color:var(--ink-soft)}
h2:first-child{margin-top:6px}
small{color:var(--ink-soft)}

/* ==================== ШАПКА ==================== */
header{
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
  backdrop-filter:blur(var(--blur)) saturate(180%);
  border:.5px solid var(--stroke);
  box-shadow:var(--shadow), inset 0 1px 0 var(--glass-hi);
  border-radius:var(--r);
  padding:13px 15px;
  position:sticky;top:calc(8px + var(--safe-t));z-index:20;
  transform:translateZ(0);isolation:isolate;
}
.grp{font-size:12.5px;color:var(--ink-soft);letter-spacing:.01em}
.htitle{font-size:21px;font-weight:640;letter-spacing:-.022em;margin-top:1px;line-height:1.2}
.back{background:none;border:none;color:var(--accent);font-size:14px;padding:0;cursor:pointer;font-weight:500}

/* ==================== ПОЛЯ И КНОПКИ ==================== */
.row{display:flex;gap:8px;align-items:center;margin-top:9px}
.row.wrap-it{flex-wrap:wrap}
select,input,textarea,button{font:inherit;color:inherit}
select,input[type=text],input[type=date],input[type=number],input[type=tel],textarea{
  background:var(--glass-lo);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  border:.5px solid var(--stroke);
  border-radius:var(--r-sm);
  padding:11px 13px;width:100%;min-width:0;font-size:16px;
  box-shadow:inset 0 1px 2px rgba(13,26,36,.05);
}
select:focus,input:focus,textarea:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 3.5px var(--accent-soft);
}
textarea{min-height:140px;resize:vertical;line-height:1.45}
.iconbtn{
  background:var(--glass-hi);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:.5px solid var(--stroke);border-radius:var(--r-sm);
  min-width:44px;height:44px;display:grid;place-items:center;
  padding:0 12px;cursor:pointer;line-height:1;flex:none;font-size:15px;
  box-shadow:var(--shadow-sm);transition:transform .12s ease,opacity .12s ease;
}
.btn{
  background:var(--accent);color:#fff;border:none;border-radius:var(--r-sm);
  min-height:46px;padding:12px 16px;cursor:pointer;font-size:15px;font-weight:560;
  letter-spacing:-.01em;box-shadow:0 4px 14px -8px var(--accent),inset 0 1px 0 rgba(255,255,255,.22);
  transition:transform .12s ease,opacity .12s ease;
}
.btn.ghost{
  background:var(--glass-hi);color:var(--ink);border:.5px solid var(--stroke);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:var(--shadow-sm),inset 0 1px 0 var(--glass-hi);
}
.btn.wide{width:100%}
.btn.danger{background:var(--bad-soft);color:var(--bad);border:.5px solid var(--bad);box-shadow:none}
.iconbtn:active,.btn:active,.mark:active,.lesson:active{transform:scale(.965);opacity:.85}

/* ==================== КАРТОЧКИ ==================== */
ul{list-style:none;margin:12px 0 0;padding:0}
li.card,.card{
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur-card)) saturate(170%);
  backdrop-filter:blur(var(--blur-card)) saturate(170%);
  border:.5px solid var(--stroke);
  box-shadow:var(--shadow-sm),inset 0 1px 0 var(--glass-hi);
  border-radius:var(--r);
  margin-bottom:9px;padding:12px 14px;
  position:relative;overflow:hidden;
}
li.yes::before,li.no::before,li.exc::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px;z-index:2;
}
li.yes::before{background:var(--ok)}
li.no::before{background:var(--bad)}
li.exc::before{background:var(--warn)}
li.yes{background:linear-gradient(90deg,var(--ok-soft),transparent 46%),var(--glass)}
li.no{background:linear-gradient(90deg,var(--bad-soft),transparent 46%),var(--glass)}
li.exc{background:linear-gradient(90deg,var(--warn-soft),transparent 46%),var(--glass)}

.top{display:flex;align-items:center;gap:11px}
.num{font-size:12px;color:var(--ink-dim);width:20px;flex:none;
  font-variant-numeric:tabular-nums;text-align:right}
.fio{flex:1;min-width:0;font-size:15.5px;letter-spacing:-.012em}
.fio small{display:block;color:var(--ink-soft);font-size:12.5px;margin-top:2px;
  white-space:pre-wrap;word-break:break-word}

.marks{display:flex;gap:7px;flex:none}
.mark{
  border:.5px solid var(--stroke);background:var(--glass-hi);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-radius:var(--r-xs);
  width:46px;height:44px;font-size:16px;font-weight:600;cursor:pointer;
  display:grid;place-items:center;box-shadow:var(--shadow-sm);
  transition:transform .12s ease,background .15s ease;
}
.mark[aria-pressed=true].y{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);
  box-shadow:inset 0 0 0 1px var(--ok)}
.mark[aria-pressed=true].n{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);
  box-shadow:inset 0 0 0 1px var(--bad)}
.mark[aria-pressed=true].u{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);
  box-shadow:inset 0 0 0 1px var(--warn)}

.noteline{display:none;margin-top:9px}
.noteline.open{display:block}
.noteline input{font-size:16px}
.notebtn{background:none;border:none;color:var(--ink-soft);font-size:13px;
  padding:8px 0 2px;cursor:pointer;min-height:32px}
.notebtn:active{color:var(--accent)}

/* ==================== ПОЛОСЫ И ЧИПЫ ==================== */
.bar{margin-top:11px}
.bartrack{height:9px;background:var(--glass-lo);border-radius:99px;overflow:hidden;display:flex;
  box-shadow:inset 0 1px 3px rgba(13,26,36,.12)}
.barfill{background:var(--ok);background:linear-gradient(180deg,color-mix(in srgb,var(--ok) 78%,#fff),var(--ok));
  height:100%;transition:width .3s cubic-bezier(.4,0,.2,1)}
.barfill.bad{background:var(--bad);background:linear-gradient(180deg,color-mix(in srgb,var(--bad) 78%,#fff),var(--bad))}
.barfill.warn{background:var(--warn);background:linear-gradient(180deg,color-mix(in srgb,var(--warn) 78%,#fff),var(--warn))}
.stats{display:flex;gap:15px;margin-top:8px;font-size:12.5px;color:var(--ink-soft);
  font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:640}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:520;
  background:var(--glass-lo);border:.5px solid var(--stroke);border-radius:99px;padding:3px 9px;
  color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;padding-left:31px}

/* ==================== ПАРА ==================== */
.lesson{display:flex;align-items:center;gap:11px;cursor:pointer;
  transition:transform .12s ease;min-height:44px}
.pairno{
  width:40px;height:40px;flex:none;border-radius:13px;
  background:var(--accent);
  background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 72%,#fff),var(--accent));
  color:#fff;display:grid;place-items:center;font-weight:650;font-size:16px;
  box-shadow:0 5px 14px -5px var(--accent),inset 0 1px 0 rgba(255,255,255,.4);
}
.lesson .t{flex:1;min-width:0}
.lesson .t b{font-weight:600;font-size:15.5px;display:block;letter-spacing:-.014em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson .t span{font-size:12.5px;color:var(--ink-soft)}

/* ==================== ТАБ-БАР ==================== */
nav{
  position:fixed;z-index:30;
  left:calc(12px + var(--safe-l));right:calc(12px + var(--safe-r));
  bottom:calc(10px + var(--safe-b));
  transition:transform .28s cubic-bezier(.32,.72,0,1);
  display:flex;border-radius:26px;padding:5px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(26px) saturate(190%);
  backdrop-filter:blur(26px) saturate(190%);
  border:.5px solid var(--stroke);
  box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi);
  max-width:696px;margin:0 auto;
  transform:translateZ(0);isolation:isolate;
}
nav button{
  background:none;border:none;flex:1;padding:7px 2px 8px;cursor:pointer;border-radius:21px;
  color:var(--ink-soft);font-size:10.5px;font-weight:520;
  display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;
  transition:background .18s ease,color .18s ease;
}
nav button i{display:grid;place-items:center;width:24px;height:24px}
nav button svg{width:23px;height:23px;display:block}
nav button.on{color:var(--accent);background:var(--accent-soft);
  box-shadow:inset 0 1px 0 var(--glass-hi)}
nav button:active{transform:scale(.94)}

/* Зеркальный блик по кромке: имитация specular highlight */
header,nav,.card,li.card,.toast{position:relative}
header::after,nav::after,.card::after,li.card::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
  background:linear-gradient(178deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,.07) 26%,
    rgba(255,255,255,0) 52%,rgba(255,255,255,.09) 100%);
  mix-blend-mode:overlay;
}
header>*,nav>*,.card>*,li.card>*{position:relative;z-index:1}
@media (prefers-color-scheme:dark){
  header::after,nav::after,.card::after,li.card::after{
    background:linear-gradient(178deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.03) 30%,
      rgba(255,255,255,0) 60%,rgba(255,255,255,.05) 100%);
  }
}

/* Клавиатура открыта — панель уезжает, чтобы не лезть в поле ввода */
html.kb-open nav{transform:translateY(calc(100% + var(--safe-b) + 24px));pointer-events:none}
html.kb-open .wrap{padding-bottom:26px}
html.kb-open .toast{bottom:calc(var(--kb) + 22px)}

/* ==================== ПРОЧЕЕ ==================== */
.toast{
  position:fixed;bottom:calc(var(--navh) + var(--safe-b) + 22px);left:50%;
  transform:translateX(-50%) translateY(8px);
  background:var(--glass-hi);color:var(--ink);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:.5px solid var(--stroke);
  padding:11px 18px;border-radius:99px;font-size:14px;font-weight:520;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;
  max-width:88%;text-align:center;box-shadow:var(--shadow)
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--ink-soft);padding:34px 16px;font-size:14px;line-height:1.6}
.hint{font-size:13px;color:var(--ink-soft);line-height:1.55;margin:8px 4px 0}
table.prev{width:100%;border-collapse:collapse;font-size:14px}
table.prev td{border-bottom:.5px solid var(--stroke);padding:8px 4px;vertical-align:middle}
table.prev tr:last-child td{border-bottom:none}
table.prev td.st{width:44px;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
progress{width:100%;height:9px;border-radius:99px;overflow:hidden}

/* ==================== АДАПТАЦИЯ ПОД ЭКРАНЫ ==================== */
/* iPhone SE / mini — 320–375 pt */
@media (max-width:379px){
  :root{--r:18px;--r-sm:12px}
  .htitle{font-size:19px}
  .fio{font-size:14.5px}
  .mark{width:42px;height:42px}
  nav button{font-size:9.5px}
  nav button i{font-size:18px}
  .stats{gap:10px;font-size:12px}
  li.card,.card{padding:11px 12px}
}
/* Pro Max / Plus — крупные экраны */
@media (min-width:429px){
  .htitle{font-size:22px}
  .wrap{padding-left:calc(16px + var(--safe-l));padding-right:calc(16px + var(--safe-r))}
}
/* Альбомная ориентация и Dynamic Island по бокам */
@media (orientation:landscape){
  header{position:static}
  .wrap{padding-top:calc(10px + var(--safe-t))}
}
/* Планшет / десктоп */
@media (min-width:768px){
  .wrap{padding-top:18px}
  nav{max-width:520px}
}

/* Если система просит меньше прозрачности или устройство не тянет blur */
@media (prefers-reduced-transparency:reduce){
  :root{--glass:rgba(246,249,251,.97);--glass-hi:rgba(255,255,255,.99);--glass-lo:rgba(240,244,247,.97)}
  .bgfx{display:none}
  header::after,nav::after,.card::after,li.card::after{display:none}
  header,nav,.card,li.card,.toast{-webkit-backdrop-filter:none;backdrop-filter:none}
}
@media (prefers-color-scheme:dark) and (prefers-reduced-transparency:reduce){
  :root{--glass:rgba(24,32,42,.98);--glass-hi:rgba(34,44,56,.99);--glass-lo:rgba(20,27,35,.98)}
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{--glass:rgba(248,250,252,.96);--glass-hi:#fff;--glass-lo:rgba(240,244,247,.96)}
  .bgfx span{opacity:.28}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="bgfx"><span></span><span></span><span></span><span></span><span></span></div>
<div class="wrap" id="app"></div>
<nav id="nav">
  <button data-tab="pairs"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9.5 4h5v2.6h-5z"/><path d="M9 12.5h6M9 16.5h3.5"/></svg></i>Пары</button>
  <button data-tab="works"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.4"/><path d="M8.4 12.3l2.5 2.5 4.7-5.2"/></svg></i>Сдачи</button>
  <button data-tab="money"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6.4" width="18" height="11.2" rx="3"/><circle cx="12" cy="12" r="2.5"/><path d="M6.4 12h.01M17.6 12h.01"/></svg></i>Деньги</button>
  <button data-tab="group"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9.2" cy="9" r="3.2"/><path d="M3.6 19.2c.6-3.3 2.9-5 5.6-5s5 1.7 5.6 5"/><path d="M15.8 6.8a3.2 3.2 0 010 5.4M17.4 14.6c1.9.7 3 2.3 3.4 4.4"/></svg></i>Группа</button>
  <button data-tab="more"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5h8M4 15.5h3.5"/><path d="M16.5 8.5H20M11.5 15.5H20"/><circle cx="14.2" cy="8.5" r="2.2"/><circle cx="9.2" cy="15.5" r="2.2"/></svg></i>Ещё</button>
</nav>
<div class="toast" id="toast"></div>

<script>
/* ============================ ХРАНИЛИЩЕ ============================ */
const APP_V = 7;
const KEY = 'starosta-o26-ist-sii-b';
const store = {
  async get(k){
    if (window.storage) { try { const r = await window.storage.get(k); return r && r.value; } catch(e){} }
    try { return localStorage.getItem(k); } catch(e){ return null; }
  },
  async set(k,v){
    if (window.storage) { try { await window.storage.set(k,v); return; } catch(e){} }
    try { localStorage.setItem(k,v); } catch(e){ toast('Память заполнена'); }
  }
};

const $ = id => document.getElementById(id);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function todayISO(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
function fmtDate(iso){ const [y,m,d]=iso.split('-'); return `${d}.${m}.${y}`; }
function dowOf(iso){ return new Date(iso+'T12:00:00').getDay(); }
function subjName(id){ const s=S.subjects.find(x=>x.id===id); return s?s.name:'без предмета'; }
function teachName(id){ const t=S.teachers.find(x=>x.id===id); return t?t.fio:''; }
function stud(id){ return S.students.find(x=>x.id===id); }
function plural(n,a,b,c){const m=Math.abs(n)%100,k=m%10;
  return n+' '+(m>10&&m<20?c:k>1&&k<5?b:k===1?a:c);}
function surname(fio){ return String(fio).trim().split(/\s+/)[0]||''; }
function initials(fio){ const p=String(fio).trim().split(/\s+/); return p[0]+(p[1]?' '+p[1][0]+'.':'')+(p[2]?p[2][0]+'.':''); }
function norm(s){ return String(s).toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я]/g,''); }
function lev(a,b){
  const m=a.length,n=b.length; if(!m)return n; if(!n)return m;
  let prev=Array.from({length:n+1},(_,i)=>i), cur=new Array(n+1);
  for(let i=1;i<=m;i++){ cur[0]=i;
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
function matchStudent(fio){
  const q = norm(surname(fio));
  if(!q) return null;
  let exact = S.students.find(s=>norm(surname(s.fio))===q);
  if(exact) return exact;
  let best=null, bd=99;
  S.students.forEach(s=>{ const d=lev(q,norm(surname(s.fio))); if(d<bd){bd=d;best=s;} });
  return bd<=2 ? best : null;
}

}

/* ============================ ПОДСЧЁТЫ ============================ */
function lessonsOn(date){ return S.lessons.filter(l=>l.date===date).sort((a,b)=>a.pair-b.pair); }
function attOf(lid){ S.att[lid]=S.att[lid]||{}; return S.att[lid]; }
function subsOf(wid){ S.subs[wid]=S.subs[wid]||{}; return S.subs[wid]; }
function paysOf(fid){ S.pays[fid]=S.pays[fid]||{}; return S.pays[fid]; }
function missCount(sid, subjectId){
  let n=0,u=0;
  S.lessons.forEach(l=>{
    if(subjectId && l.subjectId!==subjectId) return;
    const v=(S.att[l.id]||{})[sid];
    if(v==='n') n++; else if(v==='u') u++;
  });
  return {n,u};
}
function debtWorks(sid){
  return S.works.filter(w=>{ const c=(S.subs[w.id]||{})[sid]; return !c || c.s!=='y'; });
}
function fundDebt(sid){
  let d=0;
  S.funds.forEach(f=>{ const p=(S.pays[f.id]||{})[sid]||0; if(p < (f.per||0)) d += (f.per||0)-p; });
  return d;
}

  dw.forEach(w=>{ h += `<li class="card"><div class="top"><span class="fio">${esc(w.name)}<small>${esc(subjName(w.subjectId))}${w.due?' · до '+fmtDate(w.due):''}</small></span></div></li>`; });
  h += `</ul><h2>Деньги</h2><ul>`;
  let any=false;
  S.funds.forEach(f=>{
    const paid=(S.pays[f.id]||{})[s.id]||0; const per=f.per||0;
    if(paid>=per && per>0) return; any=true;
    h += `<li class="card"><div class="top"><span class="fio">${esc(f.name)}</span>
      <span class="chip bad">${per-paid} ₽</span></div></li>`;
  });
  if(!any) h += `<div class="empty">Долгов нет.</div>`;
  h += `</ul><div class="row">
    <button class="btn ghost" data-act="msgstud" style="flex:1">Сводка в буфер</button>
    <button class="btn danger" data-act="delstud" style="flex:1">Удалить</button></div>`;
  return h;
}

const IMPORT_MODES = {
  people:  {t:'Список людей',        hint:'Одна строка — один человек. Номера в начале строки убираются сами.'},
  teachers:{t:'Список преподавателей',hint:'ФИО, а после тире — кафедра или предмет. Тире можно не ставить.'},
  subjects:{t:'Список предметов',    hint:'Одна строка — один предмет. После тире можно указать зачёт или экзамен.'},
  marks:   {t:'Отметки из журнала',  hint:'Фамилия, а рядом Н, У, плюс или минус. Фамилии сопоставятся с группой автоматически.'}
};
function viewImport(){
  const mode = ctx.imode || 'people';
  const m = IMPORT_MODES[mode];
  let h = head('Сканировать', m.t, 1) + `
    <div class="row"><select id="imode">
      ${Object.entries(IMPORT_MODES).map(([k,v])=>`<option value="${k}"${k===mode?' selected':''}>${v.t}</option>`).join('')}
    </select></div></header>
    <p class="hint">Самый точный способ на айфоне: открой «Камеру», наведи на лист, нажми значок «Живого текста» в углу кадра, выдели и скопируй — потом вставь сюда. Распознаёт система, офлайн и по-русски.</p>
    <div class="row"><textarea id="raw" placeholder="Вставь сюда текст со скана">${esc(ctx.raw||'')}</textarea></div>
    <div class="row wrap-it">
      <button class="btn ghost" data-act="ocr" style="flex:1">Распознать фото в приложении</button>
      <button class="btn" data-act="parse" style="flex:1">Разобрать</button>
    </div>
    <div id="ocrbox"></div>
    <p class="hint">${m.hint}</p>`;

  if(ctx.rows && ctx.rows.length){
    h += `<h2>Проверь перед импортом</h2><div class="card"><table class="prev">`;
    ctx.rows.forEach((r,i)=>{
      h += `<tr>
        <td class="st"><button class="iconbtn" data-act="togglerow" data-i="${i}">${r.on?'✓':'·'}</button></td>
        <td>${esc(r.text)}${r.match?`<br><small>→ ${esc(r.match.fio)}${r.status?' · '+({n:'Н — прогул',u:'У — уважительная',ok:'был на паре'}[r.status]||''):''}</small>`
            :r.needMatch?`<br><small style="color:var(--bad)">не нашёл такого в группе</small>`:''}</td>
      </tr>`;
    });
    h += `</table></div><div class="row"><button class="btn wide" data-act="doimport">Импортировать ${ctx.rows.filter(r=>r.on).length}</button></div>`;
  }
  if(ctx.imode==='marks'){
    h += `<p class="hint">Отметки лягут на пару, выбранную на вкладке «Пары» (${fmtDate(curDate)}). Если пар в этот день нет, сначала добавь пару.</p>`;
  }
  return h + `<div style="height:20px"></div>`;
}
function parseRaw(){
  const mode = ctx.imode||'people';
  const lines = String(ctx.raw||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const rows = [];
  lines.forEach(line=>{
    let t = line.replace(/^\s*\d+\s*[.)|]?\s*/,'').trim();
    if(!t) return;
    if(mode==='marks'){
      let status='n', fio=t;
      const tail = t.match(/(.+?)[\s|:;,]+([НнHhУуNn+\-–—✓✗xXхХ])\s*$/);
      if(tail){ fio = tail[1]; const c=tail[2].toLowerCase();
        if('уu'.includes(c)) status='u';
        else if('+✓'.includes(c)) status='ok';
        else status='n';
      }
      const match = matchStudent(fio);
      rows.push({text:t, fio:fio.trim(), status, match, needMatch:true, on:!!match});
    } else if(mode==='people'){
      if(t.split(/\s+/).length<2) return;
      rows.push({text:t, fio:t, on:true});
    } else if(mode==='teachers'){
      const [fio, rest] = t.split(/\s+[—–-]\s+/);
      rows.push({text:t, fio:fio.trim(), dept:(rest||'').trim(), on:true});
    } else {
      const [name, rest] = t.split(/\s+[—–-]\s+/);
      rows.push({text:t, name:name.trim(), control:(rest||'').trim(), on:true});
    }
  });
  ctx.rows = rows;
  if(!rows.length) toast('Ничего не разобрал — проверь текст');
}
function doImport(){
  const mode = ctx.imode||'people';
  const rows = (ctx.rows||[]).filter(r=>r.on);
  if(!rows.length) return toast('Нечего импортировать');
  if(mode==='people'){
    rows.forEach(r=>{ if(!matchStudent(r.fio)) S.students.push({id:uid('s'),fio:r.fio,phone:'',tg:'',note:''}); });
    S.students.sort((a,b)=>a.fio.localeCompare(b.fio,'ru'));
    toast('Список группы обновлён');
  } else if(mode==='teachers'){
    rows.forEach(r=>{ if(!S.teachers.some(t=>norm(surname(t.fio))===norm(surname(r.fio))))
      S.teachers.push({id:uid('t'),fio:r.fio,dept:r.dept||'',contact:'',note:''}); });
    toast('Преподаватели добавлены');
  } else if(mode==='subjects'){
    rows.forEach(r=>{ if(!S.subjects.some(p=>norm(p.name)===norm(r.name)))
      S.subjects.push({id:uid('p'),name:r.name,control:r.control||'',teacherId:''}); });
    toast('Предметы добавлены');
  } else {
    const ls = lessonsOn(curDate);
    if(!ls.length) return toast('На ' + fmtDate(curDate) + ' пар нет');
    const l = ls[0];
    const a = attOf(l.id);
    let k=0;
    rows.forEach(r=>{ if(!r.match) return;
      if(r.status==='ok') delete a[r.match.id]; else a[r.match.id]=r.status;
      k++; });
    toast(`Отмечено ${k} на паре: ${subjName(l.subjectId)}`);
  }
  ctx.rows=null; ctx.raw='';
  save(); render();
}
async function runOCR(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.onchange = async () => {
    const f = inp.files[0]; if(!f) return;
    const box = $('ocrbox');
    box.innerHTML = `<div class="card"><div class="hint">Готовлю распознавание…</div><progress id="pg" value="0" max="1"></progress></div>`;
    try{
      if(!window.Tesseract){
        await new Promise((res,rej)=>{
          const s=document.createElement('script');
          s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
          s.onload=res; s.onerror=()=>rej(new Error('нет сети'));
          document.head.appendChild(s);
        });
      }
      const r = await Tesseract.recognize(f,'rus',{logger:m=>{
        const pg=$('pg'); if(pg && m.progress!=null) pg.value=m.progress;
        const b=$('ocrbox').querySelector('.hint'); if(b) b.textContent = m.status==='recognizing text'?'Читаю текст…':'Загружаю словарь…';
      }});
      ctx.raw = r.data.text;
      parseRaw(); render();
      toast('Распознал — проверь строки');
    }catch(e){
      box.innerHTML = `<div class="card"><div class="hint">Не вышло: ${esc(e.message)}.<br>
        Словарь качается один раз при первом запуске — нужен интернет. Дальше работает офлайн.<br>
        Пока можно вставить текст через «Живой текст» камеры.</div></div>`;
    }
  };
  inp.click();
}

/* ============================ ДЕЙСТВИЯ ============================ */
document.addEventListener('click', e=>{
  const nb = e.target.closest('#nav button');
  if(nb){ tab=nb.dataset.tab; view=null; ctx={}; return render(); }
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const act = btn.dataset.act;
  const li  = e.target.closest('li[data-id]');
  const sid = li ? li.dataset.id : null;

  switch(act){
    case 'back': view=null; ctx={...ctx, rows:null}; break;
    case 'dshift': { const d=new Date(curDate+'T12:00:00'); d.setDate(d.getDate()+ +btn.dataset.v);
      curDate=d.toISOString().slice(0,10); break; }
    case 'today': curDate=todayISO(); break;

    case 'openatt': view='att'; ctx.lesson=btn.dataset.id; break;
    case 'mark': { const a=attOf(ctx.lesson); const v=btn.dataset.v;
      if(a[sid]===v) delete a[sid]; else a[sid]=v; save(); break; }
    case 'clearatt': if(confirm('Снять все отметки на этой паре?')){ S.att[ctx.lesson]={}; save(); } break;
    case 'attreport': { const l=S.lessons.find(x=>x.id===ctx.lesson); const a=S.att[l.id]||{};
      const nn=S.students.filter(s=>a[s.id]==='n'), uu=S.students.filter(s=>a[s.id]==='u');
      copy(`${S.group} · ${fmtDate(l.date)} · ${l.pair} пара · ${subjName(l.subjectId)}\n`+
        `Отсутствовали (Н): ${nn.length?nn.map(s=>initials(s.fio)).join(', '):'нет'}\n`+
        `По уважительной (У): ${uu.length?uu.map(s=>initials(s.fio)).join(', '):'нет'}\n`+
        `Присутствовало: ${S.students.length-nn.length-uu.length} из ${S.students.length}`, 'Отчёт в буфере'); return; }
    case 'addlesson': {
      if(!S.subjects.length) return toast('Сначала добавь предметы');
      const list = S.subjects.map((p,i)=>`${i+1}. ${p.name}`).join('\n');
      const pick = prompt('Предмет — номер из списка:\n'+list, '1'); if(!pick) return;
      const p = S.subjects[+pick-1]; if(!p) return toast('Нет такого номера');
      const pair = prompt('Номер пары', '1'); if(!pair) return;
      const kind = prompt('Тип: '+KINDS.join(' / '), 'практика')||'';
      const room = prompt('Аудитория (можно пусто)','')||'';
      S.lessons.push({id:uid('l'),date:curDate,pair:+pair,subjectId:p.id,kind,room,teacherId:p.teacherId||''});
      save(); break; }
    case 'editlesson': {
      const l = S.lessons.find(x=>x.id===btn.dataset.id);
      if(!l) return;
      if(!S.subjects.length) return toast('Сначала добавь предметы');
      const list = S.subjects.map((p,i)=>`${i+1}. ${p.name}`).join('\n');
      const cur = S.subjects.findIndex(p=>p.id===l.subjectId) + 1;
      const pick = prompt('Предмет — номер из списка:\n'+list, String(cur||1));
      if(pick===null) return;
      const p = S.subjects[+pick-1];
      if(!p) return toast('Нет такого номера');
      const pair = prompt('Номер пары', String(l.pair)); if(pair===null) return;
      const kind = prompt('Тип: '+KINDS.join(' / '), l.kind||''); if(kind===null) return;
      const room = prompt('Аудитория (можно пусто)', l.room||''); if(room===null) return;
      const date = prompt('Дата в формате ГГГГ-ММ-ДД', l.date); if(date===null) return;
      l.subjectId = p.id;
      l.pair = +pair || l.pair;
      l.kind = kind.trim();
      l.room = room.trim();
      if(/^\d{4}-\d{2}-\d{2}$/.test(date.trim())){
        l.date = date.trim();
        if(l.date !== curDate){ curDate = l.date; view = null; }
      } else if(date.trim() !== l.date){ toast('Дату не понял — оставил прежнюю'); }
      save(); break; }
    case 'dellesson': if(confirm('Удалить пару вместе с отметками?')){
      const id=btn.dataset.id; S.lessons=S.lessons.filter(l=>l.id!==id); delete S.att[id]; save(); } break;
    case 'fromtpl': {
      const d=dowOf(curDate);
      const rows=S.tpl.filter(t=>t.dow===d);
      if(!rows.length) return toast('В шаблоне нет пар на '+DOW[d]);
      let k=0;
      rows.forEach(t=>{ if(S.lessons.some(l=>l.date===curDate && l.pair===t.pair)) return;
        S.lessons.push({id:uid('l'),date:curDate,pair:t.pair,subjectId:t.subjectId,kind:t.kind,room:t.room,teacherId:''}); k++; });
      save(); toast(k?`Добавлено пар: ${k}`:'Уже всё стоит'); break; }
    case 'daysum': {
      const ls=lessonsOn(curDate);
      if(!ls.length) return toast('Пар нет');
      let txt=`${S.group} · ${fmtDate(curDate)}\n`;
      ls.forEach(l=>{ const a=S.att[l.id]||{};
        const nn=S.students.filter(s=>a[s.id]==='n').map(s=>initials(s.fio));
        const uu=S.students.filter(s=>a[s.id]==='u').map(s=>initials(s.fio));
        txt+=`\n${l.pair} пара — ${subjName(l.subjectId)}\n  Н: ${nn.join(', ')||'нет'}\n  У: ${uu.join(', ')||'нет'}\n`; });
      copy(txt,'Отчёт за день в буфере'); return; }

    case 'openwork': view='work'; ctx.work=btn.dataset.id; ctx.q=''; break;
    case 'smark': { const m=subsOf(ctx.work); const c=m[sid]||(m[sid]={s:null,mark:'',note:''});
      c.s = c.s===btn.dataset.v ? null : btn.dataset.v; save(); break; }
    case 'opennote': { const nl=li.querySelector('.noteline'); nl.classList.toggle('open');
      const i=nl.querySelector('input'); if(nl.classList.contains('open')) i.focus(); return; }
    case 'addwork': {
      if(!S.subjects.length) return toast('Сначала добавь предметы');
      const list=S.subjects.map((p,i)=>`${i+1}. ${p.name}`).join('\n');
      const pick=prompt('Предмет — номер:\n'+list,'1'); if(!pick) return;
      const p=S.subjects[+pick-1]; if(!p) return toast('Нет такого номера');
      const name=prompt('Название работы','Лабораторная 1'); if(!name) return;
      const due=prompt('Дедлайн в формате ГГГГ-ММ-ДД (можно пусто)','')||'';
      S.works.push({id:uid('w'),subjectId:p.id,name:name.trim(),due:due.trim()}); save(); break; }
    case 'delwork': if(confirm('Удалить работу вместе с отметками?')){
      delete S.subs[ctx.work]; S.works=S.works.filter(w=>w.id!==ctx.work); view=null; save(); } break;
    case 'workreport': { const w=S.works.find(x=>x.id===ctx.work); const m=S.subs[w.id]||{};
      const line=s=>{ const c=m[s.id]||{}; return `${c.s==='y'?'+':c.s==='n'?'−':'·'} ${s.fio}`+
        ((c.mark||c.note)?' — '+[c.mark,c.note].filter(Boolean).join(' · '):''); };
      copy(`${S.group} · ${w.name} (${subjName(w.subjectId)})\n`+S.students.map(line).join('\n'),'Отчёт в буфере'); return; }

    case 'openfund': view='fund'; ctx.fund=btn.dataset.id; break;
    case 'pay': { const f=S.funds.find(x=>x.id===ctx.fund); const p=paysOf(f.id);
      p[sid] = (p[sid]||0)>=(f.per||0) ? 0 : (f.per||0); save(); break; }
    case 'addfund': { const name=prompt('На что собираем?','На нужды группы'); if(!name) return;
      const per=prompt('Сколько с человека, ₽','200'); if(per===null) return;

      S.funds=S.funds.filter(f=>f.id!==ctx.fund); view=null; save(); } break;
    case 'fundreport': { const f=S.funds.find(x=>x.id===ctx.fund); const p=S.pays[f.id]||{};
      const debt=S.students.filter(s=>(p[s.id]||0)<(f.per||0));

        (debt.map(s=>initials(s.fio)+((p[s.id]||0)?` (${p[s.id]})`:'')).join(', ')||'нет'),'Список должников в буфере'); return; }

      S.students.push({id:uid('s'),fio:fio.trim(),phone:'',tg:'',note:''});

      S.students=S.students.filter(x=>x.id!==ctx.stud); view=null; save(); } break;
    case 'msgstud': { const s=stud(ctx.stud); const {n,u}=missCount(s.id); const dw=debtWorks(s.id);
      copy(`${s.fio}\nПропуски: ${n} Н, ${u} У\nНе сдано: ${dw.length?dw.map(w=>w.name).join(', '):'всё сдано'}\n`+
        `Долг по сборам: ${fundDebt(s.id)} ₽`,'Сводка в буфере'); return; }
    case 'dutynext': { const s=S.students[S.duty.idx % S.students.length];
      if(s){ S.duty.log.push({date:todayISO(),studentId:s.id}); S.duty.idx=(S.duty.idx+1)%S.students.length; save(); } break; }
    case 'risk': { const bad=S.students.filter(s=>missCount(s.id).n>=S.limit);
      copy(`${S.group} · ${S.limit}+ прогулов\n`+(bad.length?bad.map(s=>`${initials(s.fio)} — ${missCount(s.id).n} Н`).join('\n'):'таких нет'),
        bad.length?`Под угрозой: ${bad.length}`:'Все в порядке'); return; }

    case 'goimport': view='import'; ctx={imode:'people',raw:'',rows:null}; break;
    case 'godir': view='dir'; ctx.dir=btn.dataset.v; break;
    case 'gotpl': view='tpl'; break;
    case 'adddir': {
      if(ctx.dir==='teachers'){ const fio=prompt('ФИО преподавателя'); if(!fio) return;
        const dept=prompt('Кафедра или предмет','')||'';
        S.teachers.push({id:uid('t'),fio:fio.trim(),dept,contact:'',note:''}); }
      else { const name=prompt('Название предмета'); if(!name) return;
        const control=prompt('Форма контроля: зачёт / экзамен / дифзачёт','')||'';
        S.subjects.push({id:uid('p'),name:name.trim(),control,teacherId:''}); }
      save(); break; }
    case 'editdir': { const id=btn.dataset.id;
      if(ctx.dir==='teachers'){ const t=S.teachers.find(x=>x.id===id);
        const fio=prompt('ФИО',t.fio); if(fio){ t.fio=fio.trim(); t.dept=prompt('Кафедра или предмет',t.dept)||t.dept; } }
      else { const p=S.subjects.find(x=>x.id===id);
        const name=prompt('Название',p.name); if(name){ p.name=name.trim(); p.control=prompt('Форма контроля',p.control)||p.control; } }
      save(); break; }
    case 'deldir': { const id=btn.dataset.id;
      if(!confirm('Удалить?')) return;
      if(ctx.dir==='teachers') S.teachers=S.teachers.filter(x=>x.id!==id);
      else S.subjects=S.subjects.filter(x=>x.id!==id);
      save(); break; }
    case 'addtpl': {
      if(!S.subjects.length) return toast('Сначала добавь предметы');
      const dw=prompt('День недели: 1 пн, 2 вт, 3 ср, 4 чт, 5 пт, 6 сб','1'); if(!dw) return;
      const list=S.subjects.map((p,i)=>`${i+1}. ${p.name}`).join('\n');
      const pick=prompt('Предмет — номер:\n'+list,'1'); if(!pick) return;
      const p=S.subjects[+pick-1]; if(!p) return toast('Нет такого номера');
      const pair=prompt('Номер пары','1'); if(!pair) return;
      const kind=prompt('Тип: '+KINDS.join(' / '),'практика')||'';
      const room=prompt('Аудитория','')||'';
      S.tpl.push({id:uid('x'),dow:+dw,pair:+pair,subjectId:p.id,kind,room}); save(); break; }
    case 'deltpl': S.tpl=S.tpl.filter(t=>t.id!==btn.dataset.id); save(); break;

    case 'ocr': runOCR(); return;
    case 'parse': ctx.raw=$('raw').value; parseRaw(); break;
    case 'togglerow': { const r=ctx.rows[+btn.dataset.i]; r.on=!r.on; break; }
    case 'doimport': doImport(); return;

    case 'csvatt': exportAtt(); return;
    case 'csvworks': exportWorks(); return;
    case 'backup': download('starosta-backup-'+todayISO()+'.json', JSON.stringify(S), 'application/json'); return;
    case 'restore': restore(); return;
  }
  render();
});
document.addEventListener('change', e=>{
  const t=e.target, act=t.dataset.act;
  const li=t.closest('li[data-id]'); const sid=li?li.dataset.id:null;
  if(t.id==='curDate'){ curDate=t.value; return render(); }
  if(t.id==='imode'){ ctx.imode=t.value; ctx.rows=null; return render(); }
  if(act==='note'){ const m=subsOf(ctx.work); const c=m[sid]||(m[sid]={s:null,mark:'',note:''});
    c.mark=''; c.note=t.value.trim(); save(); return render(); }
  if(act==='paysum'){ paysOf(ctx.fund)[sid]=+t.value||0; save(); return render(); }
  if(act==='fphone'){ stud(ctx.stud).phone=t.value.trim(); save(); return; }
  if(act==='ftg'){ stud(ctx.stud).tg=t.value.trim(); save(); return; }
  if(act==='fnote'){ stud(ctx.stud).note=t.value.trim(); save(); return; }
  if(act==='limit'){ S.limit=+t.value||3; save(); return; }
});
document.addEventListener('input', e=>{
  if(e.target.id==='q'){ ctx.q=e.target.value; const p=e.target.selectionStart; render();
    const n=$('q'); if(n){ n.focus(); n.setSelectionRange(p,p); } }
  if(e.target.id==='gq'){ ctx.gq=e.target.value; const p=e.target.selectionStart; render();
    const n=$('gq'); if(n){ n.focus(); n.setSelectionRange(p,p); } }
  if(e.target.id==='raw'){ ctx.raw=e.target.value; }
});

/* ============================ ЭКСПОРТ ============================ */
function download(name, text, type){
  const blob=new Blob([type==='application/json'?text:'\ufeff'+text],{type:(type||'text/csv')+';charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
  toast('Файл готов');
}
function exportAtt(){
  const ls=S.lessons.slice().sort((a,b)=> a.date===b.date ? a.pair-b.pair : (a.date<b.date?-1:1));
  if(!ls.length) return toast('Пар ещё нет');
  let rows=[];
  rows.push(['','Дата',...ls.map(l=>fmtDate(l.date))]);
  rows.push(['','Пара',...ls.map(l=>l.pair)]);
  rows.push(['','Предмет',...ls.map(l=>subjName(l.subjectId))]);
  rows.push(['№','Студент',...ls.map(()=>''),'Н','У']);
  S.students.forEach((s,i)=>{
    const cells=ls.map(l=>{ const v=(S.att[l.id]||{})[s.id]; return v==='n'?'Н':v==='u'?'У':''; });
    const c=missCount(s.id);
    rows.push([i+1,s.fio,...cells,c.n,c.u]);
  });
  download(`Посещаемость_${S.group}_${todayISO()}.csv`, rows.map(r=>r.join(';')).join('\n'));
}
function exportWorks(){
  if(!S.works.length) return toast('Работ ещё нет');
  const rows=[['№','Студент',...S.works.map(w=>`${subjName(w.subjectId)}: ${w.name}`)]];
  S.students.forEach((s,i)=>{
    rows.push([i+1,s.fio,...S.works.map(w=>{ const c=(S.subs[w.id]||{})[s.id]||{};
      return c.s==='y' ? (c.note||'сдал') : c.s==='n' ? 'не сдал' : ''; })]);
  });
  download(`Сдачи_${S.group}_${todayISO()}.csv`, rows.map(r=>r.map(x=>String(x).replace(/;/g,',')).join(';')).join('\n'));
}
function restore(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{ try{ const d=JSON.parse(fr.result);
        if(!d.students) throw new Error('не тот файл');
        if(!confirm('Заменить все текущие данные содержимым файла?')) return;
        S=Object.assign(fresh(),d); save(); view=null; render(); toast('Данные восстановлены');
      }catch(e){ toast('Файл не подошёл'); } };
    fr.readAsText(f); };
  inp.click();
}

/* ============================ ЗАМЕРЫ УСТРОЙСТВА ============================ */
/* Ничего не хардкодим: высоту панели, зазор до низа экрана и высоту клавиатуры
   спрашиваем у самого телефона и складываем в CSS-переменные. */
const root = document.documentElement;
let _mz;
function measure(){
  const nav = $('nav');
  if(!nav) return;
  const r = nav.getBoundingClientRect();
  const vv = window.visualViewport;
  const vh = vv ? vv.height : window.innerHeight;

  // высота панели — как она реально отрисовалась на этом экране
  root.style.setProperty('--navh', Math.round(r.height) + 'px');
  // зазор от низа экрана до панели (включая домашнюю полоску)
  root.style.setProperty('--navgap', Math.max(0, Math.round(window.innerHeight - r.bottom)) + 'px');
  // видимая высота: при открытой клавиатуре она меньше экрана
  root.style.setProperty('--vh', Math.round(vh) + 'px');

  const kb = vv ? Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)) : 0;
  root.style.setProperty('--kb', kb + 'px');
  root.classList.toggle('kb-open', kb > 90);
}
function measureSoon(){ clearTimeout(_mz); _mz = setTimeout(measure, 60); }

if(window.ResizeObserver) new ResizeObserver(measureSoon).observe(document.body);
if(window.visualViewport){
  visualViewport.addEventListener('resize', measure);
  visualViewport.addEventListener('scroll', measure);
}
window.addEventListener('orientationchange', ()=>setTimeout(measure,220));
window.addEventListener('resize', measureSoon);
window.addEventListener('pageshow', measureSoon);
document.addEventListener('focusin', measureSoon);
document.addEventListener('focusout', ()=>setTimeout(measure,120));

/* ============================ СТАРТ ============================ */
(async function(){
  const raw = await store.get(KEY);
  if(raw){ try{ S = Object.assign(fresh(), JSON.parse(raw)); }catch(e){} }
  render();
  measure();
  if(window.ResizeObserver) new ResizeObserver(measureSoon).observe($('nav'));
  setTimeout(measure, 300);
  if('serviceWorker' in navigator && location.protocol==='https:'){
    const had = !!navigator.serviceWorker.controller;
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(had && !reloading){ reloading = true; location.reload(); }
    });
    navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{});
  }
})();
</script>
